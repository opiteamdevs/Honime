name: Compilar APK Starsnin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Dar Permissao ao Gradle e Compilar
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Nenhum wrapper do Gradle encontrado na raiz ou na pasta android."
          exit 1
        fi

    - name: Salvar o APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: starsnin-apk-final
        path: |
          app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/debug/*.apk
          **/*.apk
        if-no-files-found: error
        
