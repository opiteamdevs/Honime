name: Gerador Direto de APK Starsnin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Capacitor para Gerar o APK
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init StarsninBrowser com.starsnin.browser --web-dir .
        npx cap add android

    - name: Compilar o APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: starsnin-apk-final
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        
